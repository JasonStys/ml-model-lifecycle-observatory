# File: ci.yml
# Purpose: Verify Python, PostgreSQL, manifests, performance, documentation, and containers.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lifecycle verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked package and tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify formatting, linting, and strict types
        run: |
          python -m ruff format --check src tests scripts/validate-manifests.py
          python -m ruff check src tests scripts/validate-manifests.py
          python -m mypy
      - name: Run unit, property, API, concurrency, and lifecycle tests
        run: python -m pytest -m "not postgres"
      - name: Audit locked Python dependencies
        run: >-
          python -m pip_audit --strict --disable-pip --no-deps
          --progress-spinner off --requirement requirements.lock
      - name: Enforce training and inference budgets
        run: >-
          python -m ml_observatory.cli benchmark
          --report docs/reports/generated/benchmark.json
      - name: Validate Kubernetes manifests
        run: python scripts/validate-manifests.py
      - name: Upload executable evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifecycle-evidence
          path: |
            coverage.xml
            htmlcov
            docs/reports/generated/benchmark.json
          if-no-files-found: error

  postgres:
    name: PostgreSQL 18.6 integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: observatory
          POSTGRES_USER: observatory
          POSTGRES_PASSWORD: observatory-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U observatory -d observatory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      OBSERVATORY_POSTGRES_DSN: >-
        postgresql://observatory:observatory-ci-only@127.0.0.1:5432/observatory
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked package and tools
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Verify PostgreSQL schema constraints
        run: python -m pytest -m postgres --no-cov

  repository:
    name: Repository contract verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Validate documentation, headers, and code index
        run: |
          node scripts/validate-repository.mjs
          node scripts/generate-code-index.mjs --check
          bash -n scripts/verify.sh scripts/demo.sh
      - name: Validate Compose model
        run: docker compose config --quiet

  container:
    name: Hardened container build
    runs-on: ubuntu-latest
    needs: [python, repository]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build service image
        run: docker build --tag ml-model-lifecycle-observatory:ci .

# File: native-app.yml
# Purpose: Verify real Windows model authoring and a relocated, self-contained native package.
name: Native application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_package:
        description: Retain the complete unsigned package from trusted main for owner review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Actual Windows model lifecycle application
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use patched Python and bundled Tcl/Tk
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.10"
          check-latest: true
      - name: Install locked scientific and packaging dependencies
        run: |
          python -m pip install -r requirements.lock -r requirements-native.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify native source and real controls
        run: |
          python -m ruff format --check desktop native_tests scripts/build-native.py scripts/archive_native.py tests
          python -m ruff check desktop native_tests scripts/build-native.py scripts/archive_native.py tests
          New-Item -ItemType Directory -Force .runtime | Out-Null
          python -m pytest native_tests tests/test_native_workspace.py tests/test_native_archive.py tests/test_native_identity.py --no-cov --basetemp=.runtime/native-tests
      - name: Freeze exact clean-source model application
        run: python scripts/build-native.py --output release/windows
      - name: Relocate ZIP and run actual native workflows twice
        run: python scripts/archive_native.py release/windows/MLModelLifecycleObservatory artifacts/native/windows
      - name: Retain bounded receipts and actual application screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-model-acceptance
          path: |
            artifacts/native/windows/summary.json
            artifacts/native/windows/first/*.json
            artifacts/native/windows/first/*.png
            artifacts/native/windows/reopen/*.json
            artifacts/native/windows/reopen/*.png
          if-no-files-found: warn
          retention-days: 1
      - name: Retain complete unsigned package only on explicit trusted-main request
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MLModelLifecycleObservatory-1.1.0-windows-x64
          path: |
            release/windows/MLModelLifecycleObservatory-1.1.0-windows-x64.zip
            release/windows/MLModelLifecycleObservatory-1.1.0-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 1

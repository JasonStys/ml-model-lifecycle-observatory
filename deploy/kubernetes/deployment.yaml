# File: deployment.yaml
# Purpose: Run a hardened, single-writer demonstration API with explicit health probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-observatory
  labels:
    app.kubernetes.io/name: ml-observatory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ml-observatory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ml-observatory
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/jasonstys/ml-model-lifecycle-observatory:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OBSERVATORY_REGISTRY_PATH
              value: /data/registry.sqlite3
            - name: OBSERVATORY_ARTIFACT_ROOT
              value: /data/models
            - name: OBSERVATORY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ml-observatory-admin
                  key: token
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: temp
          emptyDir:
            sizeLimit: 64Mi

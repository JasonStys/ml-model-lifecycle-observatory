# File: pyproject.toml
# Purpose: Define package metadata, supported runtimes, dependencies, and verification gates.
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-model-lifecycle-observatory"
version = "1.0.0"
description = "A reproducible predictive-model lifecycle with safe artifacts, promotion controls, drift monitoring, and rollback evidence."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Jason Stys" }]
dependencies = [
  "fastapi>=0.141,<0.142",
  "numpy>=2.3,<3",
  "pydantic>=2.13,<3",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.9,<2",
  "uvicorn[standard]>=0.53,<0.54",
]

[project.optional-dependencies]
dev = [
  "hatchling>=1.27,<2",
  "httpx>=0.28,<0.29",
  "hypothesis>=6.140,<7",
  "mypy>=1.18,<3",
  "pip-audit>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.14,<0.17",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
ml-observatory = "ml_observatory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_observatory"]

[tool.hatch.build.targets.wheel.force-include]
"sql" = "ml_observatory/sql"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider --basetemp=.test-runtime --cov=ml_observatory --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=95"
testpaths = ["tests"]
markers = [
  "postgres: requires OBSERVATORY_POSTGRES_DSN and a PostgreSQL server",
  "performance: deterministic performance budget checks",
]

[tool.coverage.run]
branch = true
source = ["ml_observatory"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ml_observatory"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

